<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>そでメモ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--paper:#ffffff;--ink:#1a1a1a;--sub:#6b665e;--line:#6a9fd8;--pink:#d94fa0;--chip:#e4dfd6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;display:flex;justify-content:center;padding:8px}
.wrap{width:100%;max-width:380px;height:100%;display:flex;flex-direction:column;--s:min(50vw,200px)}
.bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;font-family:system-ui,sans-serif;flex:none}
.bar button{flex:none;border:0;border-radius:12px;padding:4px 10px;background:var(--chip);color:var(--ink);font-size:12px}
.bar button.on{background:var(--line);color:#fff}
.card{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;background:var(--paper);padding:10px 12px 8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.photo{flex:none;width:var(--s);height:var(--s);background:#fff;border:5px solid var(--ink);position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;font-family:system-ui,sans-serif;font-size:12px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.title{flex:none;width:var(--s);margin-top:6px;border:0;background:transparent;color:var(--ink);font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","ヒラギノ明朝 ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:22px;line-height:1.3;text-align:center;letter-spacing:.25em;padding:2px 0;outline:none}
.rule{flex:none;width:var(--s);height:3px;background:var(--line);margin:1px 0 20px}
.tw{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.tate{writing-mode:vertical-rl;height:100%;max-width:100%;width:6em;border:0;resize:none;background:transparent;color:var(--ink);font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","ヒラギノ明朝 ProN","Yu Mincho","Noto Serif JP",serif;font-size:22px;line-height:1.8;letter-spacing:.06em;padding:2px;outline:none;overflow-x:auto;overflow-y:hidden}
.foot{flex:none;width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:4px;font:11px system-ui,sans-serif;color:var(--sub)}
.foot button{border:0;background:none;color:var(--sub);text-decoration:underline;font-size:11px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;font-family:system-ui,sans-serif;color:#fff;padding:16px}
.ov.on{display:flex}
.cb{--b:min(80vw,320px);width:var(--b);height:var(--b);background:#fff;position:relative;overflow:hidden;touch-action:none;outline:3px solid #fff;cursor:grab}
.cb img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.ov p{margin:0;font-size:12px;opacity:.8}
.ov input[type=range]{width:min(80vw,320px)}
.ov .row{display:flex;gap:12px}
.ov button{border:0;border-radius:18px;padding:8px 22px;font-size:14px;background:#fff;color:#111}
.ov button.ok{background:var(--line);color:#fff}
.start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5}
.start h1{margin:0;font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","ヒラギノ明朝 ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:40px;letter-spacing:.3em;padding-left:.3em}
.start .bl{width:min(50vw,200px);height:3px;background:var(--line)}
.start button{margin-top:18px;border:5px solid var(--ink);background:#fff;color:var(--ink);font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","ヒラギノ明朝 ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;font-size:22px;letter-spacing:.4em;padding:10px 28px 10px 34px}
.wrap.hide{display:none}
.title::placeholder,.tate::placeholder{color:var(--sub);opacity:.7}
</style>
</head>
<body>
<div class="start" id="start"><h1>そでメモ</h1><div class="bl"></div><button id="go">書く</button></div>
<div class="wrap hide" id="wrap">
  <div class="bar" id="bar"></div>
  <div class="card">
    <div class="photo" id="photo">タップして写真を選ぶ</div>
    <input type="file" id="file" accept="image/*" hidden>
    <input class="title" id="title" placeholder="タイトル・名前" maxlength="30">
    <div class="rule"></div>
    <div class="tw"><textarea class="tate" id="body" placeholder="ここに縦書きで書く…"></textarea></div>
    <div class="foot"><span id="stamp"></span><button id="del">このメモを削除</button></div>
  </div>
</div>
<div class="ov" id="ov"><p>ドラッグで位置、ピンチ/スライダーで拡大縮小</p>
<div class="cb" id="cb"><img id="cimg" alt=""></div>
<input type="range" id="zoom" min="1" max="5" step="0.01" value="1">
<div class="row"><button id="cx">キャンセル</button><button class="ok" id="cok">決定</button></div></div>
<script>
const KEY='sode-memo-v1';
let items=[],cur=null,timer;
const $=id=>document.getElementById(id);
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){$('stamp').textContent='保存できませんでした(容量不足)'}}
function fmt(t){const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function newItem(){const n={id:Date.now(),img:'',title:'',body:'',t:Date.now()};items.unshift(n);cur=n;save();render()}
function render(){
  const bar=$('bar');bar.innerHTML='';
  const add=document.createElement('button');add.textContent='＋ 新規';add.onclick=newItem;bar.append(add);
  items.forEach(it=>{const b=document.createElement('button');b.textContent=fmt(it.t)+(it.title?' '+it.title.slice(0,6):'');
    if(it===cur)b.className='on';b.onclick=()=>{cur=it;render()};bar.append(b)});
  const p=$('photo');p.innerHTML='';
  if(cur.img){const i=document.createElement('img');i.src=cur.img;p.append(i)}else p.textContent='タップして写真を選ぶ';
  $('title').value=cur.title;$('body').value=cur.body;fit();$('stamp').textContent='更新 '+fmt(cur.t);
}
function fit(){const t=$('body');t.style.width='1px';const w=Math.max(t.scrollWidth+6,t.parentElement.clientWidth*0+90);t.style.width=w+'px'}
function touch(){cur.t=Date.now();clearTimeout(timer);timer=setTimeout(()=>{save();$('stamp').textContent='保存しました '+fmt(cur.t)},400)}
$('title').oninput=e=>{cur.title=e.target.value;touch()};
$('body').oninput=e=>{cur.body=e.target.value;fit();touch()};
$('photo').onclick=()=>$('file').click();
const cb=$('cb'),cimg=$('cimg'),zoom=$('zoom');
let C={w:0,h:0,base:1,z:1,tx:0,ty:0,box:0};
function clampC(){const sc=C.base*C.z,mx=Math.max(0,(C.w*sc-C.box)/2),my=Math.max(0,(C.h*sc-C.box)/2);
  C.tx=Math.min(mx,Math.max(-mx,C.tx));C.ty=Math.min(my,Math.max(-my,C.ty))}
function drawC(){clampC();const sc=C.base*C.z;cimg.style.width=C.w*sc+'px';cimg.style.height=C.h*sc+'px';
  cimg.style.left=(C.box/2+C.tx-C.w*sc/2)+'px';cimg.style.top=(C.box/2+C.ty-C.h*sc/2)+'px';zoom.value=C.z}
function setZ(z){C.z=Math.min(5,Math.max(1,z));drawC()}
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  cimg.onload=()=>{C.w=cimg.naturalWidth;C.h=cimg.naturalHeight;$('ov').classList.add('on');
    C.box=cb.clientWidth;C.base=C.box/Math.min(C.w,C.h);C.z=1;C.tx=C.ty=0;drawC()};
  cimg.src=URL.createObjectURL(f);e.target.value='';
};
const P=new Map();let pd=0;
cb.onpointerdown=e=>{cb.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);pd=0};
cb.onpointermove=e=>{
  if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);
  if(P.size===1){C.tx+=e.clientX-o[0];C.ty+=e.clientY-o[1];P.set(e.pointerId,[e.clientX,e.clientY]);drawC()}
  else{P.set(e.pointerId,[e.clientX,e.clientY]);const v=[...P.values()],d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);
    if(pd)setZ(C.z*d/pd);pd=d}
};
cb.onpointerup=cb.onpointercancel=e=>{P.delete(e.pointerId);pd=0};
cb.onwheel=e=>{e.preventDefault();setZ(C.z*(e.deltaY<0?1.08:0.92))};
zoom.oninput=()=>setZ(+zoom.value);
$('cx').onclick=()=>{$('ov').classList.remove('on')};
$('cok').onclick=()=>{
  const sc=C.base*C.z,left=C.box/2+C.tx-C.w*sc/2,top=C.box/2+C.ty-C.h*sc/2;
  const c=document.createElement('canvas');c.width=c.height=640;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,640,640);
  x.drawImage(cimg,-left/sc,-top/sc,C.box/sc,C.box/sc,0,0,640,640);
  cur.img=c.toDataURL('image/jpeg',.85);cur.t=Date.now();save();$('ov').classList.remove('on');render();
};
$('del').onclick=()=>{if(!confirm('このメモを削除しますか?'))return;
  items=items.filter(i=>i!==cur);if(!items.length)return newItem();cur=items[0];save();render()};
$('go').onclick=()=>{$('start').style.display='none';$('wrap').classList.remove('hide');fit()};
try{document.fonts.ready.then(fit)}catch(e){}
load();if(!items.length)newItem();else{cur=items[0];render()}
</script>
</body>
</html>
